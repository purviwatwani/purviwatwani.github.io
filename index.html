<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Purviews — Purvi Watwani</title>
<meta name="description" content="Purvi's little corner of the internet: journals, travel photos, reads, quotes and side quests."/>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;1,300;1,400&family=DM+Sans:opsz,wght@9..40,300;9..40,400;9..40,500&display=swap" rel="stylesheet"/>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
--bg:#fdf3e8;--bg2:#f6dfe0;--card:#fffaf4;--line:#ecd8c4;--fg:#2d2622;--muted:#7d6b62;--subtle:#b39f92;
--accent:#c4553b;--shadow:rgba(150,80,50,.12);--window:#fffaf4;--overlay:rgba(30,28,24,.45);
--serif:'Cormorant Garamond',Georgia,serif;--sans:'DM Sans',system-ui,sans-serif;
}
html.dark{
--bg:#1a1917;--bg2:#211f1c;--card:#2a2824;--line:#3a3832;--fg:#e8e4d9;--muted:#948f84;--subtle:#5a574e;
--accent:#c9ad7e;--shadow:rgba(0,0,0,.4);--window:#242220;--overlay:rgba(0,0,0,.6);
}
html{scroll-behavior:smooth}
html:not(.dark) body{background:radial-gradient(900px 500px at 90% -5%,#f9d6c9 0,transparent 65%),radial-gradient(700px 500px at -5% 105%,#dfd6f3 0,transparent 65%),radial-gradient(600px 400px at 60% 110%,#d4ebd9 0,transparent 70%),#fdf3e8}
html:not(.dark) .tile:nth-child(1){background:#fde0d3}
html:not(.dark) .tile:nth-child(2){background:#e7ddf6}
html:not(.dark) .tile:nth-child(3){background:#d6ebf3}
html:not(.dark) .tile:nth-child(4){background:#fbedbd}
html:not(.dark) .tile:nth-child(5){background:#fbd7e2}
html:not(.dark) .tile:nth-child(6){background:#d9eed6}
html:not(.dark) .tile:nth-child(7){background:#ffe2bd}
html:not(.dark) .tile:nth-child(8){background:#d3e3f8}
html:not(.dark) .tile{border-color:rgba(255,255,255,.7)}
html:not(.dark) .tile small{color:#6e5d54}
html:not(.dark) .drawer{background:#fff6ec}
html:not(.dark) .thumb{background:#f7e3d6}
body{min-height:100vh;background:radial-gradient(1200px 600px at 85% -10%,var(--bg2),transparent 70%),var(--bg);
color:var(--fg);font-family:var(--sans);font-weight:300;transition:background .4s,color .4s;display:flex;flex-direction:column}
a{color:inherit}
.wrap{width:100%;max-width:1240px;margin:0 auto;padding:0 40px;flex:1;display:flex;flex-direction:column}
.titlebar,.tagline{display:none}

/* top bar */
.top{display:flex;align-items:center;justify-content:flex-end;padding:28px 0}
.logo{font-family:var(--serif);font-size:24px;letter-spacing:.06em}
.top-right{display:flex;gap:14px;align-items:center}
.pill{font:400 11px var(--sans);letter-spacing:.1em;text-transform:uppercase;padding:8px 16px;border:1px solid var(--line);
border-radius:99px;background:transparent;color:var(--muted);cursor:pointer;text-decoration:none;transition:.2s}
.pill:hover{color:var(--fg);border-color:var(--accent)}

/* hero */
main{flex:1;display:flex;align-items:center}
.hero{display:grid;grid-template-columns:minmax(0,5fr) minmax(0,7fr);gap:72px;align-items:center;padding:24px 0 56px}
.eyebrow{font-size:11px;letter-spacing:.22em;text-transform:uppercase;color:var(--accent);margin-bottom:22px}
h1{font-family:var(--serif);font-weight:300;font-size:clamp(64px,8vw,112px);line-height:.95;letter-spacing:-.01em;margin-bottom:26px}
h1 em{font-style:italic;color:var(--accent)}
.lede{font-family:var(--serif);font-size:23px;line-height:1.55;color:var(--muted);max-width:430px;margin-bottom:34px}
.socials{display:flex;flex-wrap:wrap;gap:10px}
.socials a{display:inline-flex;align-items:center;gap:8px;font-size:11px;letter-spacing:.1em;text-transform:uppercase;
text-decoration:none;color:var(--muted);padding:9px 16px;border:1px solid var(--line);border-radius:99px;transition:.2s}
.socials a:hover{color:var(--fg);border-color:var(--accent);transform:translateY(-1px)}
.socials svg{width:14px;height:14px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}

/* tiles */
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:16px}
.tile{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:26px 18px 20px;min-height:176px;
display:flex;flex-direction:column;align-items:flex-start;justify-content:space-between;text-align:left;font:inherit;color:inherit;
cursor:pointer;box-shadow:0 2px 10px var(--shadow);transition:transform .2s,box-shadow .2s,border-color .2s,background .4s;position:relative}
.tile:hover,.tile:focus-visible{transform:translateY(-5px);box-shadow:0 14px 30px var(--shadow);border-color:var(--accent);outline:none}
.tile .ic{font-size:38px;line-height:1}
.tile .ic svg{width:44px;height:44px;display:block}
.tile .ic-me svg{width:56px;height:56px;margin:-6px 0 -6px -4px}
.tile b{display:block;font:400 21px var(--serif);margin-bottom:3px}
.tile small{font-size:11.5px;color:var(--muted);line-height:1.4}
.tile .dot{position:absolute;top:16px;right:16px;width:9px;height:9px;border-radius:50%;background:#d95b3a}

footer{padding:26px 0 34px;font-size:11px;letter-spacing:.08em;color:var(--subtle);display:flex;justify-content:space-between;border-top:1px solid var(--line)}

/* drawer */
.overlay{position:fixed;inset:0;z-index:50;background:var(--overlay);backdrop-filter:blur(3px);opacity:0;pointer-events:none;transition:opacity .25s}
.overlay.open{opacity:1;pointer-events:auto}
.drawer{position:absolute;top:0;right:0;height:100%;width:min(640px,100%);background:var(--bg);overflow-y:auto;
padding:56px 52px 60px;transform:translateX(40px);transition:transform .3s ease;box-shadow:-20px 0 60px rgba(0,0,0,.2)}
.overlay.open .drawer{transform:none}
.close{position:absolute;top:20px;right:22px;width:38px;height:38px;border-radius:50%;border:1px solid var(--line);background:var(--card);
color:var(--muted);cursor:pointer;font-size:14px;transition:.2s}
.close:hover{color:var(--fg);border-color:var(--accent)}
.p-title{font:300 44px/1.1 var(--serif);margin-bottom:6px}
.p-sub{font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--accent);margin-bottom:24px}
.p-intro{font:italic 300 20px/1.7 var(--serif);color:var(--muted);margin-bottom:26px}
.p-text{font-size:14.5px;line-height:1.9;color:var(--muted);margin-bottom:14px}
.label{font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--subtle);margin:26px 0 12px}
.row{padding:16px 0;border-bottom:1px solid var(--line)}
.row:last-child{border:0}
.row .k{font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--subtle);margin-bottom:4px}
.row .t{font:400 19px/1.4 var(--serif)}
.row .d{font-size:11px;color:var(--subtle);margin-top:3px}
.cards{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.card{border:1px solid var(--line);border-radius:14px;background:var(--card);overflow:hidden;transition:border-color .2s,transform .2s}
.card:hover{border-color:var(--accent);transform:translateY(-2px)}
.thumb{height:150px;display:flex;align-items:center;justify-content:center;font-size:38px;background:var(--bg2)}
.thumb img{width:100%;height:100%;object-fit:cover;display:block}
.card .in{padding:13px 15px}
.card .n{font:400 17px var(--serif);margin-bottom:2px}
.card .m{font-size:11px;color:var(--muted);line-height:1.6}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:6px 0 4px}
.chip{font-size:12px;padding:7px 15px;border:1px solid var(--line);border-radius:99px;color:var(--muted);background:var(--card)}
.book{display:flex;gap:16px;margin-bottom:20px}
.spine{width:42px;height:58px;border-radius:3px;flex-shrink:0}
.book .t{font:400 18px var(--serif);margin-bottom:2px}
.book .a{font-size:12px;color:var(--muted);line-height:1.6}
.stars{color:var(--accent);font-size:12px;margin-top:3px}
.cover{width:42px;height:62px;object-fit:cover;border-radius:3px;flex-shrink:0;box-shadow:0 2px 8px var(--shadow)}
.tabs{display:flex;gap:8px;margin:0 0 14px}
.tab{font:400 11px var(--sans);letter-spacing:.1em;text-transform:uppercase;padding:8px 18px;border:1px solid var(--line);border-radius:99px;background:transparent;color:var(--muted);cursor:pointer;transition:.2s}
.tab.on{color:var(--fg);border-color:var(--accent);background:var(--card)}
.row a{text-decoration:none;color:inherit}
.row a:hover{color:var(--accent)}
.row .pv{font-size:13px;color:var(--muted);line-height:1.7;margin-top:6px}
.links{display:flex;gap:10px;flex-wrap:wrap;margin-top:22px}
.links a{font-size:11px;letter-spacing:.1em;text-transform:uppercase;text-decoration:none;color:var(--muted);padding:9px 16px;border:1px solid var(--line);border-radius:99px}
.links a:hover{color:var(--fg);border-color:var(--accent)}
.quote{padding:24px 0;border-bottom:1px solid var(--line)}
.quote:last-child{border:0}
.quote p{font:italic 300 25px/1.5 var(--serif);margin-bottom:8px}
.quote span{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.field{width:100%;padding:12px 0;border:0;border-bottom:1px solid var(--line);background:transparent;font:300 15px var(--sans);color:var(--fg);margin-bottom:18px;outline:none;transition:border-color .2s}
.field:focus{border-bottom-color:var(--accent)}
.field::placeholder{color:var(--subtle)}
textarea.field{min-height:110px;resize:none}
.btn{font:400 11px var(--sans);letter-spacing:.14em;text-transform:uppercase;padding:12px 30px;border:1px solid var(--fg);border-radius:99px;background:transparent;color:var(--fg);cursor:pointer;transition:.2s}
.btn:hover{background:var(--fg);color:var(--bg)}
.small-btn{margin-top:10px;font:400 10px var(--sans);letter-spacing:.1em;text-transform:uppercase;padding:5px 12px;border:1px solid var(--line);border-radius:99px;background:none;color:var(--muted);cursor:pointer}
.card:hover .small-btn{border-color:var(--accent);color:var(--accent)}

/* responsive */
@media (max-width:1060px){
 .hero{grid-template-columns:1fr;gap:44px;padding-top:8px}
 .lede{max-width:560px}
}
@media (max-width:640px){
 .wrap{padding:0 20px}
 .grid{grid-template-columns:repeat(2,1fr);gap:12px}
 .tile{min-height:150px}
 .drawer{padding:56px 24px 48px}
 .p-title{font-size:36px}
 .cards{grid-template-columns:1fr}
 footer{flex-direction:column;gap:6px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

/* ===== PHONE: the original "little browser window" look ===== */
@media (max-width:700px){
 html:not(.dark){--bg:#edeae2;--window:#f5f2eb;--card:#faf8f3;--line:#ddd9ce;--fg:#2c2a26;--muted:#7a7670;--subtle:#b0ac9f;--accent:#8a7a5a;--shadow:rgba(0,0,0,.06)}
 html.dark{--card:#2c2a26}
 html:not(.dark) body{background:#edeae2}
 body{justify-content:center;align-items:center;padding:24px 16px}
 .wrap{flex:none;max-width:680px;padding:0;background:var(--window);border-radius:14px;overflow:hidden;box-shadow:0 12px 50px rgba(0,0,0,.2),0 2px 8px rgba(0,0,0,.1);transition:background .4s}
 .top,footer,.eyebrow,.lede{display:none}
 .titlebar{display:flex;align-items:center;gap:10px;padding:12px 16px;background:var(--bg2);border-bottom:1px solid var(--line)}
 html:not(.dark) .titlebar{background:#e8e4db}
 html.dark .titlebar{background:#1e1c1a}
 .dots{display:flex;gap:6px}.dots i{width:12px;height:12px;border-radius:50%}
 .dots .r{background:#ff5f57}.dots .y{background:#febc2e}.dots .g{background:#28c840}
 .urlbar{flex:1;background:var(--card);border:.5px solid var(--line);border-radius:6px;padding:4px 12px;font-size:11px;color:var(--muted);letter-spacing:.03em;text-align:center}
 .mode-btn{font:300 11px var(--sans);padding:4px 11px;border:.5px solid var(--line);border-radius:6px;background:transparent;color:var(--muted);cursor:pointer;white-space:nowrap}
 main{display:block}
 .hero{display:flex;flex-direction:column;align-items:stretch;gap:0;padding:22px 18px 16px}
 .hero>div{display:contents}
 h1{order:1;text-align:center;font-size:32px;letter-spacing:.05em;margin-bottom:7px;line-height:1.2}
 h1 em{font-style:normal;color:inherit}
 .tagline{order:2;display:block;text-align:center;font-size:12px;color:var(--muted);letter-spacing:.07em;margin-bottom:26px}
 .grid{order:3;grid-template-columns:repeat(2,1fr);gap:10px;margin-bottom:22px}
 .socials{order:4;justify-content:center;gap:12px 16px;border-top:1px solid var(--line);padding-top:15px}
 .socials a{border:0;padding:0;font-size:10px;border-radius:0}
 .socials a:hover{transform:none}
 html:not(.dark) .tile:nth-child(n){background:var(--card);border-color:var(--line)}
 html:not(.dark) .tile small{color:var(--muted)}
 .tile{min-height:0;border-radius:14px;padding:22px 10px 17px;align-items:center;justify-content:flex-start;gap:13px;text-align:center;box-shadow:0 2px 8px var(--shadow)}
 .tile .ic{width:64px;height:64px;display:flex;align-items:center;justify-content:center;font-size:40px}
 .tile .ic-me svg{width:64px;height:64px;margin:0}
 .tile b{font:300 11.5px/1.45 var(--sans);margin:0;letter-spacing:.01em}
 .tile small{display:none}
 .tile .dot{top:14px;right:calc(50% - 40px);width:17px;height:17px;border:2px solid var(--card)}
 .overlay{display:flex;align-items:center;justify-content:center;padding:24px}
 .drawer{position:relative;height:auto;max-height:82vh;width:min(580px,100%);border-radius:16px;padding:36px 28px;transform:translateY(12px) scale(.98)}
 .overlay.open .drawer{transform:none}
 html:not(.dark) .drawer{background:var(--window)}
 html.dark .drawer{background:var(--window)}
 html:not(.dark) .thumb{background:var(--bg)}
 .p-title{font-size:30px}
 .cards{grid-template-columns:1fr}
}
</style>
</head>

<script>
const CONTACT_EMAIL = 'your-email@example.com'; // TODO: put your real email here
document.getElementById('yr').textContent = new Date().getFullYear();

/* theme */
const root = document.documentElement;
function setTheme(d){root.classList.toggle('dark',d);document.querySelectorAll('.js-mode').forEach(b=>b.textContent=d?'☀ light':'◐ dark');try{localStorage.setItem('theme',d?'dark':'light')}catch(e){}}
function toggleDark(){setTheme(!root.classList.contains('dark'))}
(function(){let s=null;try{s=localStorage.getItem('theme')}catch(e){}
 setTheme(s?s==='dark':matchMedia('(prefers-color-scheme: dark)').matches)})();

/* drawer */
const ov=document.getElementById('overlay'),dr=document.getElementById('drawer');
const DATA={};
['books','letterboxd','articles'].forEach(n=>fetch('data/'+n+'.json').then(r=>r.ok?r.json():null).then(d=>{DATA[n]=d}).catch(()=>{}));
const esc=t=>String(t).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const stars=r=>'★'.repeat(Math.floor(r))+(r%1>=.5?'½':'');
function booksHTML(){
 const [head,filmsSample]=panels.books.split('<div class="label">Lately watched</div>');
 let reading=head,films=filmsSample;
 const sg=DATA.books,lb=DATA.letterboxd;
 if(sg&&sg.books&&sg.books.length)reading='<div class="p-title">Reads &amp; movies</div><div class="p-sub">what I\'m consuming</div><div class="label" style="margin-top:0">Currently reading</div>'+
  sg.books.map(b=>'<div class="book">'+(b.cover?'<img class="cover" loading="lazy" alt="" src="'+esc(b.cover)+'">':'<div class="spine" style="background:#8a7a65"></div>')+'<div><div class="t">'+esc(b.title)+'</div><div class="a">'+esc(b.author||'')+'</div></div></div>').join('');
 if(lb&&lb.films&&lb.films.length)films=lb.films.map(f=>'<div class="book">'+(f.poster?'<img class="cover" loading="lazy" alt="" src="'+esc(f.poster)+'">':'<div class="spine" style="background:#8a657a"></div>')+'<div><div class="t">'+esc(f.title)+'</div><div class="a">'+esc(f.year||'')+(f.watched?' · watched '+esc(f.watched):'')+'</div>'+(f.rating?'<div class="stars">'+stars(f.rating)+'</div>':'')+'</div></div>').join('');
 return reading+'<div class="label">Lately watched</div>'+films+'<div class="links"><a href="'+esc((sg&&sg.profile)||'https://literal.club/purviews')+'" target="_blank" rel="noopener">Literal →</a><a href="https://letterboxd.com/purviews/" target="_blank" rel="noopener">Letterboxd →</a></div>';
}
function fmtDate(s){const d=new Date(s);return isNaN(d)?'':d.toLocaleDateString('en-GB',{day:'numeric',month:'short',year:'numeric'})}
function postRows(list,empty){return list.length?list.map(p=>'<div class="row"><div class="k">'+esc(fmtDate(p.date))+(p.paid?' · subscribers':'')+'</div><div class="t"><a href="'+esc(p.url)+'" target="_blank" rel="noopener">'+esc(p.title)+'</a></div>'+(p.desc?'<div class="pv">'+esc(p.desc)+'</div>':'')+'</div>').join(''):'<p class="p-text">'+empty+'</p>'}
function showTab(n){['articles','weeknotes'].forEach(k=>{document.getElementById('tab-'+k).style.display=k===n?'block':'none';document.getElementById('btn-'+k).classList.toggle('on',k===n)})}
function writingHTML(){
 const a=DATA.articles;
 if(!a||!a.posts||!a.posts.length)return panels.journals;
 const arts=a.posts.filter(p=>p.kind!=='weeknote'),wk=a.posts.filter(p=>p.kind==='weeknote');
 return '<div class="p-title">Writing</div><div class="p-sub">articles &amp; weeknotes</div><div class="tabs"><button class="tab on" id="btn-articles" onclick="showTab(\'articles\')">Articles</button><button class="tab" id="btn-weeknotes" onclick="showTab(\'weeknotes\')">Weeknotes</button></div><div id="tab-articles">'+postRows(arts,'Nothing here yet.')+'</div><div id="tab-weeknotes" style="display:none">'+postRows(wk,'Weeknotes will show up here soon.')+'</div><div class="links"><a href="'+esc(a.profile)+'" target="_blank" rel="noopener">Read on Substack →</a></div>';
}
function openPanel(id){document.getElementById('content').innerHTML=id==='books'?booksHTML():id==='journals'?writingHTML():(panels[id]||'');dr.scrollTop=0;ov.classList.add('open');document.body.style.overflow='hidden'}
function closePanel(){ov.classList.remove('open');document.body.style.overflow=''}
document.addEventListener('keydown',e=>{if(e.key==='Escape')closePanel()});
function sendNote(){
 const v=id=>document.getElementById(id).value.trim();
 const body=encodeURIComponent(v('nMsg')+'\n\n— '+(v('nName')||'a visitor')+(v('nMail')?' ('+v('nMail')+')':''));
 location.href='mailto:'+CONTACT_EMAIL+'?subject='+encodeURIComponent('A word from purviews')+'&body='+body;
}
